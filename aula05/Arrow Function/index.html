<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posto de Abastecimento</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="container">
        <h1>Abastecimento</h1>
        <hr>
        <p>Tabela de Preços:</p>
        <ul class="precos">
            <li>Gasolina: <strong>R$ 6,04</strong></li>
            <li>Etanol: <strong>R$ 5,24</strong></li>
            <li>Diesel: <strong>R$ 6,22</strong></li>
        </ul>

        <form id="formCombustivel" onsubmit="event.preventDefault()">
            <div class="input-group">
                <label>Tipo de Combustível</label>
                <select id="combustivel">
                    <option value="">Selecione a opção</option>
                    <option value="gasolina">Gasolina</option>
                    <option value="etanol">Etanol</option>
                    <option value="diesel">Diesel</option>
                </select>
            </div>

            <div class="input-group">
                <label>Quantidade (litros):</label>
                <input type="number" id="litros" step="0.1" min="0" placeholder="Ex: 20.5">
            </div>
        </form>

        <h2>Total: <span id="resultado">R$ 0,00</span></h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
